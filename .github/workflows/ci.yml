name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build (0 warnings) + unit tests
    runs-on: xcode-27 # Apple Silicon, macOS 27 (preview image), matches local Xcode 27.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Show toolchain versions
        run: |
          swift --version
          sw_vers

      - name: Build app (Swift 6 strict, warnings as errors)
        run: WARNINGS_AS_ERRORS=1 scripts/dev-build.sh

      - name: Unit tests (integration tests skip; no Colima on the runner)
        run: scripts/run-tests.sh

      - name: Package .app (ad-hoc signed) to exercise the script
        run: scripts/build-app.sh

  ui-tests:
    name: UI tests (XCUITest, fixtures)
    runs-on: xcode-27
    timeout-minutes: 30
    # Runs on the hosted xcode-27 runner (no docker CLI there, so docker-dependent tests skip).
    # Informational until it is green there consistently.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Build UI-test app + run XCUITest
        run: scripts/ui-tests.sh

      - name: Upload UI test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            build/ui-tests.log
            build/ui-test-results.xcresult
          retention-days: 7
          if-no-files-found: ignore
