name: Release

# Pushing tag vX.Y.Z builds the DMG, attests its build provenance and creates a DRAFT GitHub Release.
# The release manager approves the `release` environment, reviews the draft and publishes it manually.
#
# Two modes, chosen by whether the SIGN_IDENTITY secret is set:
#   signed  - Developer ID signing + notarization (scripts/release.sh), needs every secret below.
#   ad-hoc  - no Apple Developer ID yet: ad-hoc signed, not notarized (docs/RELEASE.md 3.6). The
#             release notes then explain how to open the app and how to verify the attestation.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   MACOS_CERT_P12_BASE64   "Developer ID Application" certificate exported as .p12, base64-encoded
#   MACOS_CERT_PASSWORD     password of the .p12 file
#   SIGN_IDENTITY           e.g. Developer ID Application: Your Name (TEAMID)
#   NOTARY_KEY_P8_BASE64    App Store Connect API key (.p8), base64-encoded
#   NOTARY_KEY_ID           Key ID of the API key
#   NOTARY_ISSUER_ID        Issuer ID
# Variables (non-secret): BUNDLE_ID (optional, default dev.colimax.ColimaX)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write      # create the release
  id-token: write      # artifact attestation (Sigstore)
  attestations: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'

      - name: Check tag matches VERSION file
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ "${GITHUB_REF_NAME}" = "v${VERSION}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match v${VERSION}"; exit 1; }
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: scripts/run-tests.sh

      - name: Choose signing mode
        env:
          HAS_IDENTITY: ${{ secrets.SIGN_IDENTITY != '' }}
        run: |
          if [ "$HAS_IDENTITY" = "true" ]; then echo "SIGNED=1" >> "$GITHUB_ENV"; else echo "SIGNED=0" >> "$GITHUB_ENV"; fi
          [ "$HAS_IDENTITY" = "true" ] && echo "Mode: Developer ID + notarization" || echo "Mode: ad-hoc (no SIGN_IDENTITY secret)"

      - name: Import certificate into a temporary keychain
        if: env.SIGNED == '1'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign, notarize, DMG
        if: env.SIGNED == '1'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'dev.colimax.ColimaX' }}
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          SKIP_TESTS: "1"
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/release.sh
          rm -f "$NOTARY_KEY_PATH"

      - name: Build ad-hoc DMG (no Developer ID)
        if: env.SIGNED == '0'
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'dev.colimax.ColimaX' }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: build/ColimaX-${{ env.VERSION }}.dmg

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          if [ "$SIGNED" = "0" ]; then
            cat >> "$RUNNER_TEMP/notes.md" <<EOF

          ### Installing this build

          This build is **not notarized by Apple** (ad-hoc signed). Either:

          - install with one command: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh\` ([read the script first](https://github.com/${GITHUB_REPOSITORY}/blob/main/scripts/install.sh)), or
          - open the DMG, drag ColimaX into Applications, open it once, then **System Settings → Privacy & Security → Open Anyway** (or \`xattr -dr com.apple.quarantine /Applications/ColimaX.app\`).

          The DMG was built by GitHub Actions from this tag. Compare \`shasum -a 256 ColimaX-${VERSION}.dmg\` with the \`.sha256\` file, or check its build provenance:
          \`gh attestation verify ColimaX-${VERSION}.dmg -R ${GITHUB_REPOSITORY}\`
          EOF
          fi

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "build/ColimaX-${VERSION}.dmg" "build/ColimaX-${VERSION}.dmg.sha256" \
            --title "ColimaX ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --draft $PRE

      - name: Delete temporary keychain
        if: always() && env.SIGNED == '1'
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
